services:
  askdocs-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askdocs-backend
    ports:
      - "8000:8000"
    environment:
      ASKDOCS_DB_PATH: "/data/askdocs.db"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      ASKDOCS_CORS_ORIGINS: "${ASKDOCS_CORS_ORIGINS:-*}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
